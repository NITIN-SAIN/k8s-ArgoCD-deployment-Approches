apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-child              # Root application name
  namespace: argocd             # Always in ArgoCD namespace
spec:
  project: default              # Can also assign to a Project if needed
  source:
    repoURL: https://github.com/NITIN-SAIN/k8s-ArgoCD-deployment-Approches.git   # Repo containing child apps
    targetRevision: main        # Git branch to track
    path: NGINX-USING-UI-Approch   # Path where child app manifests are stored
  destination:
    server: https://kubernetes.default.svc  # Deploying inside the same cluster
    namespace: default             # Applications (CRDs) must live in argocd namespace
  syncPolicy:
    automated:
      prune: true                 # Prune removed child apps
      selfHeal: true
