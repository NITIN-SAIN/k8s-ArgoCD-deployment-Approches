apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-webserver
  labels:
    app: apache-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: apache-app
  template:
    metadata:
      labels:
        app: apache-app
    spec:
      containers:
        - name: apache
          image: httpd:latest
          ports:
            - containerPort: 80
